name: Auto Update Vault & Sitemap

on:
  schedule:
    - cron: '0 0 * * *' # Chạy tự động mỗi ngày vào lúc 0h UTC
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub bất cứ lúc nào

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        run: python update_vault.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tools.json sitemap.xml
          git commit -m "Automated update: Tools and Sitemap [skip ci]" || exit 0
          git push