name: Auto Update FlashTool Vault

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-vault:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run update script
        run: python update_vault.py
      - name: Commit and push changes if any
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add tools.json sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Automated Vault Update [skip ci]' && git push)
