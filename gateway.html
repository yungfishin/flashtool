<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang chuẩn bị liên kết tải xuống - FlashTool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
    
    <!-- [DÁN MÃ QUẢNG CÁO POPUNDER / ONCLICK CỦA MONETAG HOẶC ADSTERRA Ở ĐÂY] -->
    <!-- Mã popunder sẽ chạy ẩn khi người dùng tương tác bất kỳ đâu trên trang Gateway này -->
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <!-- HEADER -->
    <header class="w-full border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-xl py-4">
        <div class="max-w-3xl mx-auto px-4 text-center">
            <span class="text-xl font-extrabold tracking-tight text-white">FlashTool Gateway</span>
        </div>
    </header>

    <!-- CONTENT BOX -->
    <main class="max-w-xl w-full mx-auto px-4 py-12 flex-grow flex flex-col items-center justify-center text-center">
        
        <!-- BANNER STICKY TRÊN KHUNG CHỜ -->
        <div class="w-full bg-slate-900/60 border border-slate-800 rounded-2xl p-4 mb-8 min-h-[90px] flex items-center justify-center text-slate-500 text-xs">
            <!-- [DÁN MÃ QUẢNG CÁO BANNER TRANG GATEWAY Ở ĐÂY] -->
            <span>⚡ Banner Quảng Cáo Góc Chờ (300x250 / Responsive) ⚡</span>
        </div>

        <div class="w-full bg-slate-900/80 border border-slate-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-slate-800">
                <div id="progressBar" class="h-full bg-emerald-500 transition-all duration-1000 w-full"></div>
            </div>

            <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto mb-6 text-2xl font-black" id="countdown">
                5
            </div>

            <h2 class="text-xl font-bold text-white mb-2">Đang chuẩn bị liên kết tệp an toàn...</h2>
            <p class="text-slate-400 text-sm mb-8">Vui lòng đợi trong giây lát để hệ thống xác thực đường dẫn tải xuống.</p>

            <div id="actionArea" class="hidden">
                <a id="downloadBtn" href="#" class="w-full py-3.5 px-6 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-base text-center transition-all shadow-xl shadow-emerald-500/20 block">
                    Bấm Vào Đây Để Tải Xuống
                </a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="w-full border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
        <p>An toàn & Bảo mật tuyệt đối &bull; Powered by FlashTool</p>
    </footer>

    <!-- SCRIPT ĐẾM NGƯỢC VÀ XỬ LÝ LINK -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url');

        let timeLeft = 5;
        const countdownEl = document.getElementById('countdown');
        const progressBar = document.getElementById('progressBar');
        const actionArea = document.getElementById('actionArea');
        const downloadBtn = document.getElementById('downloadBtn');

        if (!targetUrl) {
            document.querySelector('main').innerHTML = `<div class="text-red-400 font-semibold">Đường dẫn không hợp lệ hoặc đã hết hạn!</div>`;
        } else {
            const totalTime = timeLeft;
            const timer = setInterval(() => {
                timeLeft--;
                countdownEl.innerText = timeLeft;
                progressBar.style.width = `${(timeLeft / totalTime) * 100}%`;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    countdownEl.parentElement.style.display = 'none';
                    actionArea.classList.remove('hidden');
                    downloadBtn.href = targetUrl;
                }
            }, 1000);
        }
    </script>
</body>
</html>
